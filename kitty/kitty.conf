include theme.conf

# Keep font variants automatic so Kitty follows the installed Nerd Font family.
bold_font auto
italic_font auto
bold_italic_font auto
disable_ligatures cursor

# Inherit the user's shell while retaining Kitty's prompt and SSH integration.
shell .
shell_integration enabled

window_padding_width 8
placement_strategy center

tab_bar_edge top
tab_bar_style separator
tab_bar_align start
tab_bar_min_tabs 2
tab_bar_show_new_tab_button no
tab_separator " │ "
tab_title_max_length 30
tab_title_template " {index}: {title} "
active_tab_font_style bold
inactive_tab_font_style normal

cursor_shape block
cursor_shape_unfocused hollow

# Opaque surfaces avoid compositor blur and Kitty's transparency overhead.
background_opacity 1.0
dynamic_background_opacity no
background_blur 0

detect_urls yes
url_style straight
underline_hyperlinks hover
show_hyperlink_targets ctrl
allow_hyperlinks ask
copy_on_select no

enable_audio_bell no
